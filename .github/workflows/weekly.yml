name: GitHub weekly trending (no AI)
on:
  schedule:
    - cron: '0 1 * * 1'
    - cron: '20 1 * * 1'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/weekly.yml'
      - 'update.mjs'
      - 'parser.mjs'
permissions:
  contents: write
concurrency:
  group: github-weekly
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Collect and validate top ten
        run: node update.mjs
      - name: Save immutable weekly snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then
            echo 'No changes; existing week retained.'
          else
            git commit -m 'Save GitHub Trending weekly snapshot'
            git push
          fi
